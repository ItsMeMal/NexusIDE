name: nexus_ide
description: A cross-platform coding workspace with an incremental AI Agent roadmap.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.9.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  file_selector: ^1.1.0
  code_text_field: ^1.1.0
  flutter_highlight: ^0.7.0
  highlight: ^0.7.0
  path: ^1.9.1
  http: ^1.2.2
  flutter_secure_storage: ^9.2.4
  crypto: ^3.0.6
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/agent_skills/coding-implementation/SKILL.md
    - assets/agent_skills/debugging/SKILL.md
    - assets/agent_skills/flutter-development/SKILL.md
    - assets/agent_skills/ui-ux-design/SKILL.md
    - assets/agent_skills/testing/SKILL.md
    - assets/agent_skills/secure-code-review/SKILL.md
    - assets/agent_skills/api-integration/SKILL.md
